<template>
  <template lwc:if={hasLane}>
    <div class="slds-box slds-box_x-small lane-panel">
      <div
        class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small"
      >
        <h2 class="slds-text-heading_small">{laneTitle}</h2>
        <c-help-hint
          topic="rfp-pricing"
          label="Help: pricing a lane"
        ></c-help-hint>
      </div>
      <template lwc:if={milesLine}>
        <p
          data-id="lane-miles"
          class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small"
        >
          {milesLine}
        </p>
      </template>

      <div class="slds-grid slds-wrap slds-gutters_x-small">
        <div class="slds-col slds-size_1-of-1">
          <lightning-radio-group
            data-id="cost-source"
            label="Cost source"
            type="button"
            options={sourceOptions}
            value={costSource}
            onchange={handleSource}
          ></lightning-radio-group>
        </div>
        <template lwc:if={isBidSource}>
          <div class="slds-col slds-size_1-of-2">
            <lightning-combobox
              data-id="bid-select"
              label="Bid"
              value={selectedBidId}
              options={bidOptions}
              onchange={handleBidSelect}
            ></lightning-combobox>
          </div>
        </template>
        <div class="slds-col slds-size_1-of-3">
          <lightning-input
            data-id="cost"
            type="number"
            step="0.01"
            min="0"
            label="Cost"
            value={costInputValue}
            disabled={costLocked}
            onchange={handleCost}
          ></lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-3">
          <lightning-input
            data-id="margin"
            label="Margin %"
            value={marginValue}
            onchange={handleMargin}
          ></lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-3">
          <lightning-input
            data-id="sell"
            type="number"
            step="0.01"
            min="0"
            label={sellLabel}
            value={sellValue}
            onchange={handleSell}
          ></lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-1">
          <p
            data-id="sell-mode"
            class="slds-text-body_small slds-text-color_weak"
          >
            {sellMode}
          </p>
        </div>
        <template lwc:if={hasPerDistance}>
          <div class="slds-col slds-size_1-of-1">
            <p class="slds-text-body_small">
              <span data-id="cost-per-distance">{costPerDistanceText}</span>
              <span data-id="sell-per-distance" class="slds-m-left_small"
                >{sellPerDistanceText}</span
              >
            </p>
          </div>
        </template>
      </div>

      <template lwc:if={bestBidHint}>
        <button
          data-id="best-bid-hint"
          type="button"
          class="slds-button slds-button_reset hint"
          onclick={handleUseBest}
        >
          {bestBidHint}
        </button>
      </template>
      <template lwc:if={otherCurrencyNote}>
        <p data-id="other-currency" class="slds-text-color_weak">
          {otherCurrencyNote}
        </p>
      </template>

      <lightning-textarea
        data-id="notes"
        label="Notes"
        value={notes}
        onchange={handleNotes}
      ></lightning-textarea>

      <div class="slds-m-top_x-small">
        <lightning-button
          data-id="save-price"
          variant="brand"
          label="Save price"
          disabled={saveDisabled}
          onclick={handleSavePrice}
        ></lightning-button>
        <lightning-button
          data-id="add-bid"
          class="slds-m-left_x-small"
          label="Add carrier rate"
          onclick={handleAddBid}
        ></lightning-button>
      </div>

      <template lwc:if={error}>
        <p
          data-id="panel-error"
          class="slds-text-color_error slds-m-top_x-small"
          role="alert"
        >
          {error}
        </p>
      </template>

      <template lwc:if={showForm}>
        <div class="slds-m-top_x-small">
          <c-rfp-bid-form
            lane-id={laneId}
            currency={currency}
            bid={editingBid}
            onsave={handleSaveBid}
            oncancel={handleCancelBid}
          ></c-rfp-bid-form>
        </div>
      </template>

      <template lwc:if={hasBids}>
        <ul class="slds-m-top_x-small slds-has-dividers_bottom-space">
          <template for:each={bidRows} for:item="b">
            <li key={b.Id}>
              <button
                data-id="bid-row"
                data-bid-id={b.Id}
                type="button"
                class={b.buttonClass}
                title="Edit this bid"
                onclick={handleEditBid}
              >
                <span class="slds-text-title_bold">{b.Carrier_Display__c}</span>
                <span class="slds-m-left_x-small">{b.rateText}</span>
                <span class="slds-m-left_x-small slds-text-color_weak"
                  >{b.Status__c}</span
                >
              </button>
            </li>
          </template>
        </ul>
      </template>

      <template lwc:if={hasRoutePlaces}>
        <div data-id="route" class="slds-m-top_x-small">
          <c-route-map
            view={routeView}
            loading={loadingRoute}
            unit={unit}
            hazmat={laneHazmat}
            onrefreshroute={handleRefreshRoute}
          ></c-route-map>
        </div>
      </template>

      <template lwc:if={loadingHistory}>
        <lightning-spinner
          size="small"
          alternative-text="Loading history"
        ></lightning-spinner>
      </template>
      <template lwc:if={truncated}>
        <p
          data-id="truncated"
          class="slds-text-color_weak slds-text-body_small"
        >
          Only the first 500 loads are shown.
        </p>
      </template>
      <!-- The panel column is far narrower than the results table, which would
           otherwise wrap to one character per line; it scrolls sideways instead. -->
      <div data-id="history-scroll" class="history-scroll">
        <div class="history-scroll__inner">
          <c-lane-benchmark-results
            rows={historyRows}
            origin-label={originLabel}
            destination-label={destinationLabel}
          ></c-lane-benchmark-results>
        </div>
      </div>
      <template lwc:if={showCarrierLeads}>
        <div class="slds-m-top_x-small">
          <c-carrier-leads
            data-id="carrier-leads"
            request-json={historyRequestJson}
            currency-code={currency}
          ></c-carrier-leads>
        </div>
      </template>
      <template lwc:if={historyRequestJson}>
        <div data-id="split" class="slds-m-top_x-small">
          <c-split-lane-options
            data-id="split-options"
            request-json={historyRequestJson}
            start-currency={currency}
            lane-currency={currency}
            stats-by-currency={historyStats}
            allow-use-as-cost
            onuseascost={handleUseAsCost}
          ></c-split-lane-options>
        </div>
      </template>
    </div>
  </template>
  <template lwc:else>
    <p data-id="empty" class="slds-text-color_weak slds-p-around_small">
      Pick a lane to price it.
    </p>
  </template>
</template>
