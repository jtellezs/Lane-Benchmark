<template>
  <lightning-card title="RFP Tool" icon-name="standard:contract">
    <div class="slds-p-horizontal_small">
      <template lwc:if={error}>
        <p data-id="error" class="slds-text-color_error slds-m-bottom_x-small">
          {error}
        </p>
      </template>
      <template lwc:if={mappingNote}>
        <p
          data-id="mapping-note"
          class="slds-text-color_weak slds-m-bottom_x-small"
        >
          {mappingNote}
        </p>
      </template>

      <template lwc:if={loading}>
        <div class="slds-is-relative slds-p-vertical_large" data-id="loading">
          <lightning-spinner
            alternative-text="Loading the project"
            size="small"
          ></lightning-spinner>
        </div>
      </template>

      <template lwc:if={busy}>
        <div
          class="slds-grid slds-grid_vertical-align-center slds-gutters_x-small slds-m-bottom_x-small"
        >
          <div class="slds-col slds-size_1-of-2">
            <lightning-progress-bar
              data-id="progress"
              value={progressValue}
              size="large"
            ></lightning-progress-bar>
          </div>
          <div class="slds-col slds-text-color_weak" data-id="progress-text">
            {progressText}
          </div>
          <div class="slds-col">
            <lightning-button
              data-id="stop"
              label="Stop"
              onclick={handleStop}
            ></lightning-button>
          </div>
        </div>
      </template>

      <template lwc:if={isList}>
        <c-rfp-project-list onopen={handleOpenProject}></c-rfp-project-list>
      </template>

      <template lwc:if={isUpload}>
        <div class="slds-m-bottom_x-small">
          <lightning-button
            data-id="back"
            label="All projects"
            onclick={handleBack}
          ></lightning-button>
          <template lwc:if={hasLanes}>
            <lightning-button
              class="slds-m-left_x-small"
              data-id="to-workbench"
              label="Back to the lanes"
              onclick={handleShowWorkbench}
            ></lightning-button>
          </template>
        </div>
        <h2 class="slds-text-heading_small slds-m-bottom_x-small">
          {projectTitle}
        </h2>
        <c-rfp-upload
          project-id={projectId}
          onparsed={handleParsed}
        ></c-rfp-upload>
      </template>

      <template lwc:if={isMap}>
        <div class="slds-m-bottom_x-small">
          <lightning-button
            data-id="back"
            label="All projects"
            onclick={handleBack}
          ></lightning-button>
        </div>
        <h2 class="slds-text-heading_small slds-m-bottom_x-small">
          {projectTitle} — {fileName}
        </h2>
        <c-rfp-column-mapper
          headers={headers}
          sample-rows={sampleRows}
          mapping={mapping}
          busy={busy}
          onmappingchange={handleMappingChange}
          onimport={handleImport}
        ></c-rfp-column-mapper>
      </template>

      <template lwc:if={isWorkbench}>
        <c-rfp-toolbar
          data-id="toolbar"
          busy={busy}
          project={project}
          lanes={lanes}
          precision={precision}
          lookback-days={lookbackDays}
          radius={radius}
          radius-unit={radiusUnit}
          include-bids={includeBids}
          onback={handleBack}
          onuploadmore={handleUploadMore}
          onsettingchange={handleSetting}
          onloadhistory={handleLoadHistory}
          onrefreshhistory={handleRefreshHistory}
          onretryfailed={handleRetryFailed}
        ></c-rfp-toolbar>

        <template lwc:if={summary}>
          <p
            data-id="summary"
            class="slds-text-color_weak slds-m-bottom_x-small"
          >
            {summary}
          </p>
        </template>

        <c-rfp-bulk-bar
          selected-count={selectedCount}
          total-count={lanes.length}
          currency={currency}
          busy={busy}
          last-result={bulkResult}
          onbulk={handleBulk}
          onselectsimilar={handleSelectSimilar}
        ></c-rfp-bulk-bar>

        <template lwc:if={similarNote}>
          <p
            data-id="similar-note"
            class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small"
          >
            {similarNote}
          </p>
        </template>

        <div
          class="slds-grid slds-wrap slds-grid_vertical-align-end slds-gutters_x-small slds-m-bottom_x-small"
        >
          <div class="slds-col">
            <lightning-combobox
              data-id="filter-status"
              label="Show"
              value={filter.status}
              options={statusOptions}
              onchange={handleFilterStatus}
            ></lightning-combobox>
          </div>
          <div class="slds-col">
            <lightning-input
              data-id="filter-text"
              type="search"
              label="Search origin, destination, equipment"
              value={filter.text}
              onchange={handleFilterText}
            ></lightning-input>
          </div>
          <div class="slds-col">
            <span data-id="filter-count" class="slds-text-color_weak"
              >{filterCount}</span
            >
          </div>
        </div>

        <template lwc:if={twinOffer}>
          <div
            data-id="twin-offer"
            class="slds-notify slds-notify_alert slds-theme_info slds-m-bottom_x-small"
            role="status"
          >
            <span>{twinText}</span>
            <lightning-button
              data-id="twin-apply"
              class="slds-m-left_x-small"
              label="Apply"
              variant="brand"
              disabled={busy}
              onclick={handleTwinApply}
            ></lightning-button>
            <lightning-button
              data-id="twin-dismiss"
              class="slds-m-left_x-small"
              label="Not now"
              onclick={handleTwinDismiss}
            ></lightning-button>
          </div>
        </template>

        <div class="slds-grid slds-wrap slds-gutters_x-small">
          <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12">
            <c-rfp-lane-table
              lanes={visibleLanes}
              selected-id={selectedId}
              selected-ids={selectedIds}
              pending-ids={pendingIds}
              row-errors={rowErrors}
              default-margin={defaultMargin}
              locked={busy}
              currency={currency}
              onselect={handleSelect}
              onselectionchange={handleSelectionChange}
              onpricingchange={handlePricingChange}
              onresolveend={handleResolveEnd}
            ></c-rfp-lane-table>
          </div>
          <div
            class="slds-col slds-size_1-of-1 slds-large-size_4-of-12 panel-col"
          >
            <c-rfp-lane-panel
              lane={selectedLane}
              project={project}
              busy={busy}
              onpricingchange={handlePricingChange}
            ></c-rfp-lane-panel>
          </div>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
