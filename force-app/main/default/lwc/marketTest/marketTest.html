<template>
  <lightning-card title="Market Test" icon-name="standard:pricebook">
    <div class="slds-var-p-horizontal_medium">
      <p class="slds-text-body_small slds-var-m-bottom_small">
        Pick a lane, then record what carriers quote for it now. Each rate
        counts in this lane's median like any other bid.
      </p>

      <div class="slds-grid slds-wrap slds-gutters">
        <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12">
          <c-lane-benchmark-place-picker
            label="Origin"
            onplacechange={handleOrigin}
          ></c-lane-benchmark-place-picker>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12">
          <c-lane-benchmark-place-picker
            label="Destination"
            onplacechange={handleDestination}
          ></c-lane-benchmark-place-picker>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-12">
          <lightning-combobox
            label="Currency"
            value={currency}
            options={currencyOptions}
            onchange={handleCurrency}
          ></lightning-combobox>
        </div>
      </div>

      <template if:true={error}>
        <div class="slds-var-m-top_small slds-text-color_error" role="alert">
          {error}
        </div>
      </template>

      <template if:true={hasLane}>
        <div class="slds-grid slds-wrap slds-gutters slds-var-m-top_medium">
          <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
            <h2 class="slds-text-heading_small">What this lane has done</h2>
            <p class="slds-text-body_small slds-var-m-top_xx-small">
              {historyLine}
            </p>
          </div>
          <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
            <h2 class="slds-text-heading_small">What you are collecting</h2>
            <template if:true={summary}>
              <p class="slds-text-body_small slds-var-m-top_xx-small">
                {summary.count} rates · median {summary.median}
                {summary.currency} · {summary.min}–{summary.max}
              </p>
            </template>
            <template if:false={summary}>
              <p class="slds-text-body_small slds-var-m-top_xx-small">
                No rates recorded for this lane yet.
              </p>
            </template>
          </div>
        </div>

        <div class="slds-var-m-top_medium">
          <template if:false={adding}>
            <lightning-button
              variant="brand"
              label="Add rate"
              onclick={handleAdd}
              class="add-rate"
            ></lightning-button>
          </template>
          <template if:true={adding}>
            <c-rfp-bid-form
              currency={currency}
              onsave={handleSave}
              oncancel={handleCancel}
            ></c-rfp-bid-form>
          </template>
        </div>

        <template if:true={hasRates}>
          <table
            class="slds-table slds-table_bordered slds-var-m-top_medium"
            aria-label="Rates recorded for this lane"
          >
            <thead>
              <tr class="slds-line-height_reset">
                <th scope="col">Carrier</th>
                <th scope="col">Rate</th>
                <th scope="col">Transit</th>
                <th scope="col">Valid from</th>
                <th scope="col"></th>
              </tr>
            </thead>
            <tbody>
              <template for:each={rows} for:item="row">
                <tr key={row.Id}>
                  <td>{row.carrier}</td>
                  <td>{row.rateText}</td>
                  <td>{row.Transit_Days__c}</td>
                  <td>
                    <lightning-formatted-date-time
                      value={row.Valid_From__c}
                    ></lightning-formatted-date-time>
                  </td>
                  <td>
                    <template if:true={row.mine}>
                      <lightning-button-icon
                        icon-name="utility:delete"
                        alternative-text="Delete this rate"
                        data-id={row.Id}
                        onclick={handleDelete}
                        class="delete-rate"
                      ></lightning-button-icon>
                    </template>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </template>
      </template>
    </div>
  </lightning-card>
</template>
