name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lwc:
    name: lwc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run prettier:verify
      - run: npm run test:unit:coverage

  apex:
    name: apex
    runs-on: ubuntu-latest
    env:
      HAS_SECRET: ${{ secrets.SFDX_AUTH_URL_POSTPRODUC != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when no org secret (personal mirror)
        if: env.HAS_SECRET != 'true'
        run: echo "SFDX_AUTH_URL_POSTPRODUC is not set in this repository; Apex validation runs in the TPLM repository against PostProduc."
      - uses: actions/setup-node@v4
        if: env.HAS_SECRET == 'true'
        with: { node-version: 22 }
      - name: Install Salesforce CLI
        if: env.HAS_SECRET == 'true'
        run: npm install -g @salesforce/cli
      - name: Authenticate to PostProduc
        if: env.HAS_SECRET == 'true'
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL_POSTPRODUC }}
        run: echo "$SFDX_AUTH_URL" | sf org login sfdx-url --sfdx-url-stdin=- --alias sandbox --set-default
      - name: Validate deploy and run tests
        if: env.HAS_SECRET == 'true'
        run: >
          sf project deploy validate
          --manifest manifest/package.xml
          --post-destructive-changes manifest/destructiveChangesPost.xml
          --test-level RunSpecifiedTests
          --tests PricingDepartmentControllerTest
          --target-org sandbox
          --wait 30

  pmd:
    name: pmd
    runs-on: ubuntu-latest
    env:
      PMD_VERSION: 7.15.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install PMD
        run: |
          curl -sSL -o pmd.zip "https://github.com/pmd/pmd/releases/download/pmd_releases%2F${PMD_VERSION}/pmd-dist-${PMD_VERSION}-bin.zip"
          unzip -q pmd.zip
      - name: Run PMD (quickstart, priority 3)
        run: >
          ./pmd-bin-${PMD_VERSION}/bin/pmd check
          --dir force-app
          --rulesets config/pmd-ruleset.xml
          --minimum-priority 3
          --format text
          --fail-on-violation
